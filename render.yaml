# One Render web service: marketing site + bot API (repo: 43industries/ebby-)
#
# Dashboard: New → Blueprint → connect this repo (replace the old "43" Flask service).
# Builds from repo root, no Node required, no Root Directory setting needed.
#
# Required env vars to add manually on the service:
#   GROQ_API_KEY        (free at console.groq.com/keys)
# Optional:
#   TELEGRAM_BOT_TOKEN, ADMIN_CHAT_ID, GROQ_MODEL, ALLOWED_ORIGINS

services:
  - type: web
    name: ebby
    runtime: python
    plan: free
    buildCommand: pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn bot.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PUBLIC_BASE_URL
        fromService:
          name: ebby
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
